services:
  - type: web
    name: vouch-api
    runtime: python
    rootDir: vouch/backend
    buildCommand: pip install -r requirements.txt
    # start.sh seeds the DB, starts uvicorn, waits for it, then runs one demo cycle so the
    # held-proposals queue is populated on every cold start (Render free tier has an ephemeral DB).
    startCommand: bash scripts/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MOCK_MODE
        value: "true"
      - key: DEMO_DATASET
        value: "newegg_live"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
