services:
  - type: web
    name: vouch-api
    runtime: python
    rootDir: vouch/backend
    buildCommand: pip install -r requirements.txt
    # Seed runs at startup so the DB is always populated after a cold start or redeploy.
    startCommand: python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MOCK_MODE
        value: "true"
      - key: DEMO_DATASET
        value: "newegg_live"
      - key: ALLOWED_ORIGINS
        value: "*"
